<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="google-site-verification"
      content="nuFmDvVi206seUQpEbf3HNjnRhT7SGjILaDHJ0rLAXA"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Discover inspirational, motivational, love, life, and success quotes. Save your favorite quotes, switch themes, copy, and share instantly with QuoteVerse."
    />

    <meta
      name="keywords"
      content="quotes, motivational quotes, inspirational quotes, quote generator, life quotes, success quotes"
    />

    <meta name="author" content="Tichita Dhiman" />

    <meta property="og:title" content="QuoteVerse" />

    <meta
      property="og:description"
      content="Discover and save inspiring quotes every day."
    />

    <meta
      property="og:image"
      content="https://tichita7.github.io/QuoteVerse/preview.png"
    />

    <meta name="twitter:card" content="summary_large_image" />

    <meta property="og:url" content="https://tichita7.github.io/QuoteVerse/" />

    <title>QuoteVerse | Daily Inspirational Quotes & Quote Generator</title>

    <link rel="stylesheet" href="css/style.css" />

    <link rel="icon" type="image/png" href="favicon.png" />

    <link rel="canonical" href="https://tichita7.github.io/QuoteVerse/" />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <main class="app-container">
      <div class="quote-card">
        <div class="quote-header">
          <h1>QuoteVerse ✨</h1>
          <p>Discover one quote that changes your day</p>
        </div>

        <div id="moodBadge" class="mood-badge">Mood: Inspired ✨</div>

        <div class="quote-content">
          <p class="quote-text" id="quote">
            “The best way to get started is to quit talking and begin doing.”
          </p>

          <p class="quote-author" id="author">— Walt Disney</p>
        </div>

        <div class="category-buttons">
          <button class="category-btn" data-category="motivational">
            Motivation
          </button>

          <button class="category-btn" data-category="success">Success</button>

          <button class="category-btn" data-category="love">Love</button>

          <button class="category-btn" data-category="life">Life</button>
        </div>

        <div class="action-buttons">
          <button id="tweetBtn" class="secondary-btn">Tweet</button>

          <button id="newQuoteBtn" class="primary-btn">New Quote</button>

          <button id="copyBtn" class="secondary-btn">Copy</button>

          <button id="favoriteBtn" class="secondary-btn">❤️ Favorite</button>

          <button id="themeToggleBtn" class="secondary-btn">
            ☀️ Light Mode
          </button>
        </div>

        <div class="favorites-section">
          <button id="clearFavoritesBtn" class="clear-btn">
            Clear Favorites
          </button>

          <h2>Favorite Quotes</h2>

          <ul id="favoritesList"></ul>
        </div>
      </div>

      <footer>Made with ❤️ by Tichita</footer>
    </main>

    <script src="js/script.js"></script>
  </body>
</html>
